<head>
    <style>
        /* The colors are hard-coded and based on the `editor.background` and `editor.foreground` values from `./arduino-ide-extension/src/browser/data/default.color-theme.json` */
        @media (prefers-color-scheme: light) {
            html {
                background: #ffffff;
            }
        }

        /* The colors are hard-coded and based on the `editor.background` and `editor.foreground` values from `./arduino-ide-extension/src/browser/data/dark.color-theme.json` */
        @media (prefers-color-scheme: dark) {
            html {
                background: #1f1b2e;
            }
        }

        .theia-preload {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;

            /* Above styles copied from https://github.com/eclipse-theia/theia/blob/5aeef6c0c683b4e91713ab736957e6655b486adc/packages/core/src/browser/style/index.css#L147-L161 */
            /* Otherwise, there is a flickering when Theia's CSS loads. */

            background-image: none;
        }

        .theia-preload::after {
            /* remove default loading animation */
            content: none;
        }

        .spinner-container {
            display: flex;
            flex-direction: center;
            align-self: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
        }

        .custom-spinner {
            align-self: center;
        }

        .custom-spinner svg {
            width: 16vw;
            height: 16vh;
            animation-delay: 0;
            animation-duration: 2s;
            animation-iteration-count: infinite;
            animation-name: preload-spinner;
            animation-timing-function: ease;
        }

        @keyframes preload-spinner {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(0.8);
            }

            100% {
                transform: scale(1);
            }
        }
    </style>
</head>

<body>
    <div class="spinner-container">
        <div class="custom-spinner">
            <svg
                id="spinner"
                xmlns="http://www.w3.org/2000/svg"
                width="200"
                height="200"
                viewBox="0 0 200 200"
            >
                <defs>
                    <linearGradient
                        id="stemreachGradient"
                        x1="0%"
                        y1="0%"
                        x2="100%"
                        y2="100%"
                    >
                        <stop offset="0%" stop-color="#C026D3" />
                        <stop offset="100%" stop-color="#7C3AED" />
                    </linearGradient>
                </defs>
                <rect
                    x="4"
                    y="4"
                    width="192"
                    height="192"
                    rx="48"
                    fill="url(#stemreachGradient)"
                />
                <text
                    x="100"
                    y="142"
                    text-anchor="middle"
                    font-family="Arial, sans-serif"
                    font-weight="800"
                    font-size="118"
                    fill="#ffffff"
                >S</text>
                <path
                    transform="translate(151,-12) scale(2.8333) rotate(45,12,12)"
                    fill="#EF4444"
                    d="M2 9 L13 9 L13 4 L22 12 L13 20 L13 15 L2 15 Z"
                />
            </svg>
        </div>
    </div>
</body>
