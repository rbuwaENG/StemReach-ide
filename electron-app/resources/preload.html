<head>
    <style>
        /* The colors are hard-coded and based on the `editor.background` and `editor.foreground` values from `./arduino-ide-extension/src/browser/data/default.color-theme.json` */
        @media (prefers-color-scheme: light) {
            html {
                background: #ffffff;
            }
        }

        /* The colors are hard-coded and based on the `editor.background` and `editor.foreground` values from `./arduino-ide-extension/src/browser/data/dark.color-theme.json` */
        @media (prefers-color-scheme: dark) {
            html {
                background: #1f1b2e;
            }
        }

        .theia-preload {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;

            /* Above styles copied from https://github.com/eclipse-theia/theia/blob/5aeef6c0c683b4e91713ab736957e6655b486adc/packages/core/src/browser/style/index.css#L147-L161 */
            /* Otherwise, there is a flickering when Theia's CSS loads. */

            background-image: none;
        }

        .theia-preload::after {
            /* remove default loading animation */
            content: none;
        }

        .spinner-container {
            display: flex;
            flex-direction: center;
            align-self: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
        }

        .custom-spinner {
            align-self: center;
            animation-delay: 0;
            animation-duration: 2s;
            animation-iteration-count: infinite;
            animation-name: preload-spinner;
            animation-timing-function: ease;
        }

        @keyframes preload-spinner {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(0.92);
            }

            100% {
                transform: scale(1);
            }
        }

        .stemreach-logo {
            position: relative;
            display: inline-block;
            font-family: Arial, Helvetica, sans-serif;
            font-weight: 800;
            font-size: 6vw;
            letter-spacing: -0.01em;
            padding-top: 0.12em;
        }

        .stemreach-logo .stem {
            background: linear-gradient(to right, #C026D3, #7C3AED);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .stemreach-logo .reach {
            color: #7C3AED;
        }

        .stemreach-logo svg {
            position: absolute;
            top: 0.03em;
            right: 0.03em;
            width: 0.24em;
            height: 0.24em;
        }
    </style>
</head>

<body>
    <div class="spinner-container">
        <div class="custom-spinner">
            <span class="stemreach-logo">
                <span class="stem">STEM</span><span class="reach">reach</span>
                <svg
                    viewBox="0 0 24 24"
                    xmlns="http://www.w3.org/2000/svg"
                    style="transform: rotate(-45deg)"
                >
                    <path d="M2 9 L13 9 L13 4 L22 12 L13 20 L13 15 L2 15 Z" fill="#EF4444" />
                </svg>
            </span>
        </div>
    </div>
</body>
